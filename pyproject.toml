[project]
name = "rujuk"
version = "0.1.0"
description = "Intelligent document search and Q&A for government agencies"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "boto3>=1.35",
    "anthropic[bedrock]>=0.40",
    "pymupdf>=1.24",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "yake>=0.4.8",
    "langdetect>=1.0.9",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "fpdf2>=2.7"]

[tool.pytest.ini_options]
testpaths = ["engine", "api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "api"]
